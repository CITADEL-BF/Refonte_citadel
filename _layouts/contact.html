<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }} - Citadel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="{{ '/assets/css/header.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/footer.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

  <!-- Header réutilisable -->
  {% include header.html %}

  <!-- Section Héros -->
  <section class="hero">
    <div class="container">
      <h2>Bienvenue à Citadel</h2>
      <p>Centre d'Excellence en IA</p>
      <img src="{{ '/assets/images/hero-image.jpg' | relative_url }}" alt="Héros">
    </div>
  </section>

  <!-- Contenu injecté depuis le Markdown -->
  <main class="main-content">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <!-- Section Call to Action -->
  <section class="cta">
    <div class="container">
      <h3>Rejoignez-nous</h3>
      <a href="/contact/" class="btn">Contactez-nous</a>
    </div>
  </section>

  <!-- Section Partenaires -->
  <section class="partners">
    <div class="container">
      <h3>Nos Partenaires</h3>
      <div class="partner-logos">
        <img src="{{ '/assets/images/partner1.png' | relative_url }}" alt="Partenaire 1">
        <img src="{{ '/assets/images/partner2.png' | relative_url }}" alt="Partenaire 2">
      </div>
    </div>
  </section>

  <!-- Footer réutilisable -->
  {% include footer.html %}

</body>
</html>
