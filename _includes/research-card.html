<!-- Research Card Component -->
<div class="group bg-surface-container-lowest rounded-2xl overflow-hidden hover:shadow-xl transition-all duration-300 flex flex-col border-2 {{ include.researcher.border_color }} hover:border-opacity-60 research-card" data-category="{{ include.researcher.category }}">
  <div class="flex flex-wrap p-6 gap-6">
    <div class="w-32 h-40 shrink-0 overflow-hidden rounded-xl bg-surface-container">
      <img alt="{{ include.researcher.name }}" class="w-full h-full object-cover grayscale contrast-125" src="{{ include.researcher.image | relative_url }}">
    </div>
    <div class="flex-1 min-w-0 flex flex-col justify-between py-2">
      <div>
        <h3 class="font-bold text-lg text-primary leading-tight mb-1">{{ include.researcher.name }}</h3>
        <span class="text-xs font-semibold {{ include.researcher.category_color }} px-2 py-0.5 rounded">{{ include.researcher.category }}</span>
      </div>
      <p class="text-xs text-on-surface-variant italic">{{ include.researcher.university }}</p>
    </div>
  </div>
  <div class="px-6 pb-6 mt-auto">
    <p class="text-sm font-medium text-on-surface leading-snug group-hover:text-primary transition-colors">{{ include.researcher.description }}</p>
  </div>
</div>
