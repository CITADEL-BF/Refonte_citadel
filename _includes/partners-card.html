<!-- Partners Card Component -->
<div class="partners-card">
  <div class="partners-card-image">
    <img src="{{ include.partner.logo | relative_url }}" alt="{{ include.partner.name }}">
  </div>
  <span class="partners-card-tag">{{ include.partner.tag }}</span>
  <h3 class="partners-card-name">{{ include.partner.name }}</h3>
  <a href="{{ include.partner.url }}" class="partners-card-link">
    Savoir Plus <span class="material-symbols-outlined">chevron_right</span>
  </a>
</div>
