<!-- Header / Navbar -->
<nav class="header-nav">
  <div class="header-container">

    <!-- Logo -->
    <div class="logo">
      <img src="{{ '/assets/images/logo.webp' | relative_url }}" alt="CITADEL" width="400" height="97" style="height: 2em; width: auto; display: block;">
    </div>

    <!-- Menu desktop -->
    <div class="nav-links">
      <a href="{{ '/' | relative_url }}">Accueil</a>
      <a href="{{ '/membres/' | relative_url }}">Membres</a>
      <a href="{{ '/missions/' | relative_url }}">Missions</a>
      <a href="{{ '/sujets-de-recherche/' | relative_url }}">Sujets de Recherche</a>
      <a href="{{ '/publications/' | relative_url }}">Publications</a>
      <a href="{{ '/contact/' | relative_url }}">Contact</a>
    </div>

    <!-- Actions -->
    <div class="nav-actions">
      <a href="{{ '/blog/' | relative_url }}" class="blog-btn">Blog</a>
      
      <!-- Hamburger button mobile -->
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>

  </div>

  <!-- Mobile menu -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="{{ '/' | relative_url }}" class="mobile-menu-link">Accueil</a>
    <a href="{{ '/membres/' | relative_url }}" class="mobile-menu-link">Membres</a>
    <a href="{{ '/missions/' | relative_url }}" class="mobile-menu-link">Missions</a>
    <a href="{{ '/sujets-de-recherche/' | relative_url }}" class="mobile-menu-link">Sujets de Recherche</a>
    <a href="{{ '/publications/' | relative_url }}" class="mobile-menu-link">Publications</a>
    <a href="{{ '/contact/' | relative_url }}" class="mobile-menu-link">Contact</a>
    <a href="{{ '/blog/' | relative_url }}" class="mobile-menu-link mobile-blog-btn">Blog</a>
  </div>

  <!-- ligne séparatrice -->
  <div class="header-divider"></div>
</nav>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const menuLinks = document.querySelectorAll('.mobile-menu-link');
    const navLinks = document.querySelectorAll('.nav-links a');

    // Fonction pour déterminer la page actuelle
    function setActiveLink() {
      const currentPath = window.location.pathname;
      
      // Activer le lien du menu desktop
      navLinks.forEach(link => {
        link.classList.remove('active');
        const href = link.getAttribute('href');
        
        // Correspondance exacte ou correspondance avec trailing slash
        if (currentPath === href || currentPath === href.replace(/\/$/, '') || currentPath.replace(/\/$/, '') === href) {
          link.classList.add('active');
        }
      });
      
      // Activer le lien du menu mobile
      menuLinks.forEach(link => {
        link.classList.remove('active');
        const href = link.getAttribute('href');
        
        if (currentPath === href || currentPath === href.replace(/\/$/, '') || currentPath.replace(/\/$/, '') === href) {
          link.classList.add('active');
        }
      });
    }
    
    // Appeler la fonction au chargement
    setActiveLink();

    // Ouvrir/fermer le menu au clic sur le bouton
    hamburgerBtn.addEventListener('click', function() {
      hamburgerBtn.classList.toggle('active');
      mobileMenu.classList.toggle('open');
    });

    // Fermer le menu quand on clique sur un lien
    menuLinks.forEach(link => {
      link.addEventListener('click', function() {
        hamburgerBtn.classList.remove('active');
        mobileMenu.classList.remove('open');
      });
    });
  });
</script>
