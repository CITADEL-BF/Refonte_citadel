<!-- News Card Component -->
<div class="news-card">
  <div class="news-card-image">
    <img src="{{ include.article.image | relative_url }}" alt="{{ include.article.image_alt | default: include.article.title }}" class="news-image" loading="lazy">
  </div>
  <div class="news-card-content">
    <h4 class="news-card-title">{{ include.article.title }}</h4>
    <a href="{{ include.article.url | relative_url }}" class="news-link-inline">
      Savoir Plus <span class="material-symbols-outlined">east</span>
    </a>
  </div>
</div>
